# Local HAPI FHIR for development (spec §10, ADR 0003). Data lives in memory: restart to reset,
# then `uv run fhir-over-mcp cohort load`. CI uses the same image, pinned by digest.
services:
  hapi:
    image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
    # No healthcheck: the image is distroless (no shell or wget). Wait on /fhir/metadata from
    # the host instead, as the tests and CI do.
