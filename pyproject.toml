[project]
name = "fhir-over-mcp"
version = "0.1.0"
description = "A read-only, patient-scoped MCP server over a synthetic FHIR record, with an eval suite scored against code-derived ground truth."
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
]

[project.scripts]
fhir-over-mcp = "fhir_over_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running HAPI FHIR server (Docker)"]
addopts = "-m 'not integration' --strict-markers"
